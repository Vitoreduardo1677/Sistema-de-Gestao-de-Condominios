<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manter Apartamento</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <h1>Condomínio</h1>
    <h2>Cadastrar Apartamento</h2>

    <p id="msg" class="msg" hidden></p>

    <form id="form" class="cadastro">
        <label for="bloco">Bloco:</label>
        <select id="bloco" required></select>

        <label for="numero">Número do Apartamento:</label>
        <input type="number" id="numero" min="1" required>

        <div class="botoes">
            <button type="submit" id="btnSalvar" class="btn btn-verde">Cadastrar</button>
            <a class="btn btn-cinza" href="/apartamentos.html">Voltar</a>
        </div>
    </form>

    <script src="/js/api.js"></script>
    <script src="/js/apartamento-form.js"></script>
</body>
</html>

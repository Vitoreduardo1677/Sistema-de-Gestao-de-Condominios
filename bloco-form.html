<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manter Bloco</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <h1>Condomínio</h1>
    <h2>Manter Bloco</h2>

    <p id="msg" class="msg" hidden></p>

    <form id="form" class="cadastro">
        <label for="descricao">Descrição:</label>
        <input type="text" id="descricao">

        <label for="quantidade">Quantidade aptos:</label>
        <input type="number" id="quantidade" min="1">

        <div class="botoes">
            <button type="submit" id="btnSalvar" class="btn btn-verde">Cadastrar</button>
            <a class="btn btn-cinza" href="/blocos.html">Voltar</a>
        </div>
    </form>

    <script src="/js/api.js"></script>
    <script src="/js/bloco-form.js"></script>
</body>
</html>
